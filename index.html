    <style>
        /* ── Reset & base ── */
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            margin-bottom: 16px;
            font-size: 1.8rem;
            text-align: center;
        }

        /* ── Search ── */
        .search-box {
            width: 100%;
            max-width: 400px;
            padding: 12px 16px;
            margin-bottom: 24px;
            border-radius: 20px;
            border: 1px solid #333;
            background: #1e1e1e;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .search-box:focus {
            border-color: #0088cc;
        }

        /* ── Grid ── */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 1000px;
        }
        .game-card {
            background-color: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            overflow: hidden;
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .game-card:hover {
            transform: translateY(-4px);
            border-color: #0088cc;
            box-shadow: 0 6px 16px rgba(0, 136, 204, 0.3);
        }

        /* ── Image container ── */
        .img-container {
            width: 100%;
            height: 130px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            padding: 8px;
        }
        .fallback-title {
            color: #94a3b8;
            font-size: 11px;
            text-align: center;
            font-weight: 600;
            line-height: 1.2;
            word-break: break-word;
            padding: 4px;
        }
        .game-card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #1e1e1e;
        }
        .img-error {
            display: none !important;
        }

        .game-card .title {
            padding: 8px;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 38px;
        }

        /* ── Emulator ── */
        #emulator-container {
            width: 640px;
            height: 480px;
            max-width: 95vw;
            max-height: 75vh;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }
        .back-btn {
            display: none;
            margin-bottom: 16px;
            padding: 8px 16px;
            background: #0088cc;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }
        .back-btn:hover {
            background: #006699;
        }

        /* ── Responsive tweaks ── */
        @media (max-width: 480px) {
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 10px;
            }
            .img-container {
                height: 100px;
            }
            .game-card .title {
                font-size: 10px;
                padding: 6px;
                min-height: 32px;
            }
            h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

        const urlParams = new URLSearchParams(window.location.search);
        const romFile = urlParams.get('rom');
        const coreName = urlParams.get('core') || 'gbc';
        const gameTitle = urlParams.get('title') || 'GBC Game';

        if (romFile) {
            document.getElementById('games-menu').style.display = 'none';
            document.getElementById('search').style.display = 'none';
            document.getElementById('emulator-container').style.display = 'block';
            document.getElementById('back-btn').style.display = 'inline-block';
            document.getElementById('page-title').innerText = gameTitle;

            // EmulatorJS config
            window.EJS_player = '#game';
            window.EJS_core = coreName;
            window.EJS_gameUrl = romFile;
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(script);
        } else {
            renderGames(GAMES_LIST);
        }

        function renderGames(list) {
            const container = document.getElementById('games-menu');
            container.innerHTML = '';

            list.forEach(game => {
                const card = document.createElement('a');
                card.className = 'game-card';
                card.href =
                    `?rom=${encodeURIComponent(game.rom)}&core=${encodeURIComponent(game.core)}&title=${encodeURIComponent(game.title)}`;

                card.innerHTML = `
              <div class="img-container">
                <div class="fallback-title">${game.title}</div>
                <img src="${game.cover}" alt="${game.title}" loading="lazy" onerror="this.classList.add('img-error')" />
              </div>
              <div class="title">${game.title}</div>
            `;

                container.appendChild(card);
            });
        }

        function filterGames() {
            const q = document.getElementById('search').value.toLowerCase();
            const filtered = GAMES_LIST.filter(g =>
                g.title.toLowerCase().includes(q) ||
                g.rom.toLowerCase().includes(q)
            );
            renderGames(filtered);
        }

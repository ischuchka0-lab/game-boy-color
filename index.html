<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortal Kombat 3 - Special 56 Peoples</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 15px;
            font-size: 24px;
            letter-spacing: 2px;
            color: #e50914;
            text-shadow: 0 0 10px rgba(229, 9, 20, 0.5);
            text-transform: uppercase;
        }

        /* Контейнер эмулятора */
        .emulator-holder {
            width: 640px;
            height: 480px;
            max-width: 100%;
            border: 3px solid #333;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        .controls-hint {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
            text-align: center;
        }

        .controls-hint span {
            color: #fff;
            background: #222;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <h1>Mortal Kombat 3 (56 Peoples)</h1>

    <div class="emulator-holder">
        <div id="game"></div>
    </div>

    <div class="controls-hint">
        Управление: <span>Стрелки</span> — Движение | <span>Z</span> — A | <span>X</span> — B | <span>Enter</span> — Start | <span>Shift</span> — Select
    </div>

    <!-- Подключаем эмулятор EmulatorJS -->
    <script type="text/javascript">
        // Настройки эмулятора
        EJS_player = '#game';
        EJS_core = 'nes'; // Ядро для NES / Dendy
        EJS_gameUrl = 'Mortal Kombat 3 - Special 56 Peoples [p1].nes'; // Твой файл игры
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/'; // Данные движка из CDN
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>

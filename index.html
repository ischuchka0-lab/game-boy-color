    body { background-color: #121212; color: #fff; font-family: system-ui, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }

    .fallback-title { color: #94a3b8; font-size: 11px; text-align: center; font-weight: 600; line-height: 1.2; word-break: break-word; }
    .game-card img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; background: #1e1e1e; }
    .img-error { display: none !important; }
    .game-card .title { padding: 8px; font-size: 12px; font-weight: 500; text-align: center; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    #emulator-container { width: 640px; height: 480px; max-width: 95vw; max-height: 75vh; border: 2px solid #333; border-radius: 8px; overflow: hidden; display: none; }
    .back-btn { display: none; margin-bottom: 16px; padding: 8px 16px; background: #0088cc; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; }
    .footer-note { margin-top: 20px; font-size: 12px; color: #666; text-align: center; }

  const urlParams = new URLSearchParams(window.location.search);

  const gameTitle = urlParams.get('title') || 'Retro Game';

  if (romFile) {
    document.getElementById('games-menu').style.display = 'none';
    document.getElementById('search').style.display = 'none';
    document.getElementById('emulator-container').style.display = 'block';
    document.getElementById('back-btn').style.display = 'inline-block';
    document.getElementById('page-title').innerText = gameTitle;

    // ----- НАСТРОЙКА ЭМУЛЯТОРА (исправленные пути) -----

    EJS_pathtodata = 'data/';   // путь к папке data без точки

    // Загружаем loader.js из папки data
    const script = document.createElement('script');
    script.src = 'data/loader.js';
    script.onerror = function() {
      alert('Не найден файл data/loader.js.\nУбедитесь, что папка data лежит рядом с index.html.');
    };
    document.body.appendChild(script);
  } else {
    renderGames(GAMES_LIST);
  }

  function renderGames(list) {
    const container = document.getElementById('games-menu');
    container.innerHTML = '';
    list.forEach(game => {
      const card = document.createElement('a');
      card.className = 'game-card';
      card.href = `?rom=${encodeURIComponent(game.rom)}&core=${encodeURIComponent(game.core)}&title=${encodeURIComponent(game.title)}`;
      card.innerHTML = `
        <div class="img-container">
          <div class="fallback-title">${game.title}</div>
          <img src="${game.cover}" alt="${game.title}" loading="lazy" onerror="this.classList.add('img-error')">
        </div>
        <div class="title">${game.title}</div>
      `;
      container.appendChild(card);
    });
  }

  function filterGames() {
    const query = document.getElementById('search').value.toLowerCase();
    const filtered = GAMES_LIST.filter(g =>
      g.title.toLowerCase().includes(query) || g.rom.toLowerCase().includes(query)
    );
    renderGames(filtered);
